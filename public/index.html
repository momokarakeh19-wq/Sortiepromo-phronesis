<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sortie Promotion Phronesis 2025/2026 — Billetterie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #0B1E3D; min-height: 100vh; }
  .hero { padding: 48px 24px 40px; text-align: center; color: #FFFDF7; }
  .eyebrow { letter-spacing: 3px; text-transform: uppercase; font-size: 12px; color: #D4AF37; margin-bottom: 10px; font-family: Arial, sans-serif; }
  .hero h1 { font-size: 26px; line-height: 1.35; margin-bottom: 10px; }
  .hero p { color: #cfd6e6; font-size: 14px; font-family: Arial, sans-serif; }
  .price-tag { display: inline-block; margin-top: 16px; padding: 8px 20px; border: 1px solid #D4AF37; border-radius: 999px; color: #D4AF37; font-family: Arial, sans-serif; font-size: 14px; }
  .card { max-width: 440px; margin: 0 auto 40px; background: #FFFDF7; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); padding: 28px 24px 30px; }
  label { display: block; font-family: Arial, sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: Arial, sans-serif; background: #fff; }
  input:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212,175,55,0.2); }
  .phone-row { display: flex; gap: 8px; }
  .phone-prefix { width: 70px; flex-shrink: 0; text-align: center; background: #f4f0e3; border: 1px solid #ddd; border-radius: 8px; padding: 12px 8px; font-family: Arial, sans-serif; font-size: 14px; color: #444; }
  .total-row { margin-top: 18px; padding: 14px 16px; background: #f4f0e3; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; }
  .total-row span:first-child { color: #888; font-size: 13px; }
  .total-row span:last-child { color: #0B1E3D; font-size: 20px; font-weight: bold; }
  button { width: 100%; margin-top: 20px; padding: 15px; border: none; border-radius: 10px; background: #0B1E3D; color: #FFFDF7; font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; cursor: pointer; }
  button:hover { background: #14305c; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #message { margin-top: 12px; font-family: Arial, sans-serif; font-size: 13px; text-align: center; color: #b3261e; display: none; }
  .footnote { text-align: center; margin-top: 14px; font-family: Arial, sans-serif; font-size: 11px; color: #999; }
</style>
</head>
<body>
  <div class="hero">
    <p class="eyebrow">PHRONESIS · USSD 2025/2026</p>
    <h1>Sortie de la Promotion<br>Phronesis 2025/2026</h1>
    <p>Réserve ton billet en quelques secondes</p>
    <div class="price-tag">3 000 FCFA / billet · 26 Juillet 2026</div>
  </div>

  <div class="card">
    <label for="firstName">Prénom</label>
    <input type="text" id="firstName" placeholder="Ex : Awa" required />

    <label for="lastName">Nom</label>
    <input type="text" id="lastName" placeholder="Ex : Diop" required />

    <label for="email">Adresse email</label>
    <input type="email" id="email" placeholder="votre@email.com" required />

    <label for="phone">Numéro WhatsApp</label>
    <div class="phone-row">
      <div class="phone-prefix">+221</div>
      <input type="tel" id="phone" placeholder="77 123 45 67" required />
    </div>

    <label for="quantity">Nombre de tickets (max 10)</label>
    <input type="number" id="quantity" min="1" max="10" value="1" required />

    <div class="total-row">
      <span>Total à payer</span>
      <span id="totalAmount">3 000 FCFA</span>
    </div>

    <button id="payButton">Payer avec Wave / Orange Money</button>
    <p id="message"></p>
    <p class="footnote">Paiement sécurisé via SenePay · Ticket envoyé par email ou WhatsApp</p>
  </div>

  <script>
    const PRICE = 3000;
    const qtyInput = document.getElementById('quantity');
    const totalEl = document.getElementById('totalAmount');
    const payButton = document.getElementById('payButton');
    const message = document.getElementById('message');

    qtyInput.addEventListener('input', () => {
      let qty = parseInt(qtyInput.value) || 1;
      if (qty < 1) qty = 1;
      if (qty > 10) qty = 10;
      qtyInput.value = qty;
      totalEl.textContent = (PRICE * qty).toLocaleString('fr-FR') + ' FCFA';
    });

    payButton.addEventListener('click', async () => {
      message.style.display = 'none';
      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const email     = document.getElementById('email').value.trim();
      const phone     = document.getElementById('phone').value.trim();
      const quantity  = qtyInput.value;

      if (!firstName || !lastName || !email || !phone) {
        message.textContent = 'Veuillez remplir tous les champs.';
        message.style.display = 'block';
        return;
      }

      payButton.disabled = true;
      payButton.textContent = 'Préparation du paiement...';

      try {
        const res = await fetch('/api/create-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, phone: '+221' + phone, quantity }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur serveur.');
        window.location.href = data.checkoutUrl;
      } catch (err) {
        message.textContent = err.message;
        message.style.display = 'block';
        payButton.disabled = false;
        payButton.textContent = 'Payer avec Wave / Orange Money';
      }
    });
  </script>
</body>
</html>
