<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  h1 {

  p { color: #c9bca0; font-size: 14.5px; line-height: 1.6; }
  a {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 24px;
    border-radius: 10px;
    background: linear-gradient(135deg, #f3d98c, #d9ad53);
    color: #221a0c;
    font-weight: 600;
    text-decoration: none;
  }

<body>
  <div class="card">
    <h1>Paiement annulé</h1>
