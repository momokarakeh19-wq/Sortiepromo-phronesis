<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paiement confirmé - PHRONESIS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #221a10 0%, #14100b 55%);
    color: #f3ead8;
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  .check {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(111,174,116,0.15);
    border: 1px solid #6fae74;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    font-size: 30px;
    color: #6fae74;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
    color: #f3d98c;
    margin: 0 0 12px;
  }
  p { color: #c9bca0; font-size: 14.5px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Paiement reçu</h1>
    <p>Merci ! Votre paiement est en cours de confirmation.<br/>
    Vous recevrez votre ticket par email dans quelques instants.<br/>
    Vérifiez aussi vos spams si vous ne le voyez pas.</p>
  </div>
</body>
</html>
